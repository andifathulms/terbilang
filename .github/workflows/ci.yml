name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versi pnpm diambil dari "packageManager" di package.json — satu sumber
      # kebenaran; menyebutkannya dua kali membuat action menolak berjalan.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint

      # Sapuan menyeluruh menggerbangi seluruh sisanya. Ia berjalan dalam
      # hitungan detik; tidak ada alasan melewatinya.
      - run: pnpm test:run
      - run: pnpm test:exhaustive

      - run: pnpm build:lib
      - run: pnpm build

      # PRD.md §10: Site JS <= 100 KB gzipped. Dihitung ulang dari
      # .next/app-build-manifest.json yang baru ditulis pnpm build di atas.
      - run: pnpm build:size

      # survey:record memasang dan menjalankan paket pihak ketiga.
      # Hanya untuk pengembangan — tidak pernah di CI.
